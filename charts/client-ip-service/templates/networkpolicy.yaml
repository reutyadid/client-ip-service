{{- if .Values.networkPolicy.enabled }}
# Only the gateway may reach the pods. The app trusts X-Forwarded-For from the
# whole pod CIDR, so without this any pod in the cluster could spoof it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "client-ip-service.fullname" . }}
  labels:
    {{- include "client-ip-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "client-ip-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
