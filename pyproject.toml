[project]
name = "client-ip-service"
version = "0.1.0"
description = "Returns the caller's public IP address"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# Supply-chain cooldown: ignore package versions uploaded in the last 14 days.
exclude-newer = "14 days"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "S",   # bandit-style security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks results

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
