[project]
name = "client-ip-service"
version = "0.1.0"
description = "Returns the caller's public IP address"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# The AI failure-diagnosis step in CI (ci_diagnosis/). Not in the app image.
ci = [
    "httpx2>=2.16.0",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
]
dev = [
    # Tests and lint cover ci_diagnosis/ too. Also brings httpx2, which
    # FastAPI's TestClient uses.
    { include-group = "ci" },
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
smoke = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.uv]
# Supply-chain cooldown: ignore package versions uploaded in the last 14 days.
exclude-newer = "14 days"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "S",   # bandit-style security checks
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results; tests use fake credentials on purpose
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
# Plain `pytest` runs the unit tests only. The smoke tests run against a
# deployed environment, explicitly: `pytest tests/smoke`.
testpaths = ["tests/unit"]
pythonpath = ["."]
