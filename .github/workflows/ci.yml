name: CI

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default; each job requests only what it needs.
permissions: {}

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Lint stage: lint-python and lint-docker run in parallel on separate runners.
  lint-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          # ubuntu-24.04 has no Python 3.14; cache the one uv downloads
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  lint-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # Fan-in: tests run only after both lint jobs pass.
  test:
    needs: [lint-python, lint-docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          # ubuntu-24.04 has no Python 3.14; cache the one uv downloads
          cache-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # No -rA: it prints captured output of passing tests, and the AI
        # diagnosis tests print ::warning lines that GitHub turns into annotations
        run: uv run pytest -v --junitxml=unit-report.xml

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report
          path: unit-report.xml

      - name: Add unit test results to run summary
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/junit_summary.py "Unit tests" unit-report.xml \
            >> "$GITHUB_STEP_SUMMARY"

  # Build once and hand the exact image to scan and push as a tar artifact,
  # so the bytes that get pushed are the bytes that were scanned.
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base images come from Docker Hardened Images (ADR-0020).
      # Read-only Docker Hub token; only this job receives it.
      # Fork PRs get no secrets, so this step fails for them.
      - name: Log in to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # OCI labels (source repo, commit, created time) and the commit-SHA tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # On PRs, tag with the PR's head commit, not GitHub's temporary merge commit.
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the GitHub Actions cache; mode=max also keeps the
          # builder-stage layers, so a code change does not reinstall deps.
          cache-from: type=gha,scope=client-ip-service
          cache-to: type=gha,mode=max,scope=client-ip-service
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Scan the exact image built above. Gate on fixable CRITICAL/HIGH findings
  # (see README); justified exceptions go in .trivyignore, which Trivy reads
  # automatically.
  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # only used when the repo is public
    steps:
      # .trivyignore lives in the repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # trivy-action v0.36.0 was released after the March 2026 compromise
      # (GHSA-69fq-xp46-6x23) and pins setup-trivy to the safe v0.2.6 SHA.
      # The Trivy binary version is pinned explicitly too.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-table.txt
          exit-code: "1"

      - name: Trivy SARIF report
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Add scan results to run summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Trivy scan (CRITICAL, HIGH, fixable)"
            echo '```'
            cat trivy-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-reports
          path: |
            trivy-table.txt
            trivy-results.sarif
            sbom.cdx.json

      # Code scanning on a private personal repo needs GitHub Code Security,
      # so the upload runs only once the repo is public.
      - name: Upload SARIF to Security tab
        if: ${{ !cancelled() && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # Push the scanned image to GHCR. The only job with registry write access.
  push:
    needs: scan
    # Fork PRs get a read-only token and cannot push.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push image
        id: push
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker push "$IMAGE_NAME:$SHA"
          # Deploy by digest: immutable, unlike a tag.
          image="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$SHA")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  # Static chart checks; no cluster needed, so it runs on a GitHub runner.
  helm-lint:
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # Lint with the digest that was just pushed, against both the default
      # values and the staging values that deploy will use. values.schema.json
      # is enforced as part of lint.
      - name: Helm lint
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          helm lint charts/client-ip-service --strict \
            --set image.digest="$DIGEST"
          helm lint charts/client-ip-service --strict \
            -f charts/client-ip-service/values-staging.yaml \
            --set image.digest="$DIGEST"


  # Deploy to the staging namespace on the local kind cluster (ADR-0002),
  # from the self-hosted ARC runner, which authenticates to the cluster with
  # its own ServiceAccount (Role "deployer", staging only; ADR-0010).
  deploy:
    needs: [push, helm-lint]
    runs-on: kind-staging
    timeout-minutes: 10
    # A deployment record on the repository page (notification)
    environment:
      name: staging
      url: http://localhost/
    # Deploys queue up; one is never cancelled halfway through.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NAMESPACE: staging
      RELEASE: client-ip-service
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2

      # The private GHCR image is pulled with a dedicated read-only token
      # (ADR-0022). The Docker config is built from an environment variable and
      # passed on stdin, so the token never appears in a command line.
      # dry-run | apply creates the Secret or updates it after a token rotation.
      - name: Create or update the image pull secret
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error::The GHCR_PULL_TOKEN secret is not set"
            exit 1
          fi
          python3 -c 'import base64, json, os
          auth = base64.b64encode(f"{os.environ["OWNER"]}:{os.environ["GHCR_PULL_TOKEN"]}".encode()).decode()
          print(json.dumps({"auths": {"ghcr.io": {"auth": auth}}}))' \
            | kubectl create secret generic ghcr-pull \
                --namespace "$NAMESPACE" \
                --type=kubernetes.io/dockerconfigjson \
                --from-file=.dockerconfigjson=/dev/stdin \
                --dry-run=client --output yaml \
            | kubectl apply --filename -

      # upgrade --install: installs the first time, upgrades after that.
      # --rollback-on-failure: waits for the rollout and returns to the last
      # working release if it fails, so staging is never left half-deployed.
      # --history-max: keeps the release history (stored as Secrets) bounded.
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE" charts/client-ip-service \
            --namespace "$NAMESPACE" \
            --values charts/client-ip-service/values-staging.yaml \
            --set image.digest="$DIGEST" \
            --rollback-on-failure --wait --timeout 3m \
            --history-max 10

      - name: Add deployment to run summary
        run: |
          revision="$(helm history "$RELEASE" --namespace "$NAMESPACE" --max 1 --output json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)[-1]["revision"])')"
          {
            echo "## Deployed to staging"
            echo "- Release: \`$RELEASE\`, revision $revision"
            echo "- Image: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Cluster state goes into the job log, where the AI diagnosis reads it.
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl --namespace "$NAMESPACE" get pods --output wide || true
          kubectl --namespace "$NAMESPACE" describe pods \
            --selector "app.kubernetes.io/instance=$RELEASE" || true
          kubectl --namespace "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          kubectl --namespace "$NAMESPACE" logs \
            --selector "app.kubernetes.io/instance=$RELEASE" --tail=50 || true
          helm history "$RELEASE" --namespace "$NAMESPACE" || true

  # Smoke tests against the deployment, from inside the cluster (tests/smoke).
  # In-cluster access is what lets them prove the NetworkPolicy (ADR-0015).
  smoke-test:
    needs: [push, deploy]
    runs-on: kind-staging
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SMOKE_GATEWAY_URL: http://traefik.traefik.svc.cluster.local
      SMOKE_APP_URL: http://client-ip-service.staging.svc.cluster.local
      SMOKE_NAMESPACE: staging
      SMOKE_RELEASE: client-ip-service
      SMOKE_DIGEST: ${{ needs.push.outputs.digest }}
      SMOKE_DOCS_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-python: true

      # The deployment tests read pod status with kubectl.
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2

      - name: Install smoke test dependencies
        run: uv sync --locked --only-group smoke

      - name: Run smoke tests
        run: |
          uv run --no-sync pytest tests/smoke -v -rA \
            --junitxml=smoke-report.xml

      - name: Upload smoke test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: smoke-report.xml

      - name: Add smoke test results to run summary
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/junit_summary.py "Smoke tests" smoke-report.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl --namespace "$SMOKE_NAMESPACE" get pods,svc,networkpolicy --output wide || true
          kubectl --namespace "$SMOKE_NAMESPACE" get httproute --output yaml || true
          kubectl --namespace "$SMOKE_NAMESPACE" logs \
            --selector "app.kubernetes.io/instance=$SMOKE_RELEASE" --tail=50 || true

  # Runs only when an earlier job failed (ADR-0005). Reads the failed jobs'
  # logs (including jobs on the self-hosted runner, whose logs are streamed to
  # GitHub), asks a language model for a diagnosis, and posts it as one sticky
  # PR comment plus the run summary. Logs are untrusted: the job never executes
  # anything from the logs or the model, and its only secret is AI_API_KEY,
  # the model provider's key (ADR-0027).
  ai-diagnosis:
    needs:
      [lint-python, lint-docker, test, build, scan, push, helm-lint, deploy, smoke-test]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read         # checkout of the private repo
      actions: read          # list jobs and download their logs
      pull-requests: write   # one sticky comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          # ubuntu-24.04 has no Python 3.14; cache the one uv downloads
          cache-python: true

      - name: Install diagnosis dependencies
        run: uv sync --locked --only-group ci

      # Defaults: Groq and openai/gpt-oss-120b (ADR-0027). Repository variables
      # override them, so a retired model is replaced without a commit.
      # Without AI_API_KEY (e.g. PRs from forks) a plain failure notice is posted.
      - name: Diagnose the failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWN_JOB_NAME: ai-diagnosis
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL || 'https://api.groq.com/openai/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: uv run --no-sync python -m ci_diagnosis
